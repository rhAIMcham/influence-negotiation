    .quiz-container {

    }

    .checkContainer {

        background-color: white;
        border-radius: 8px;
    }

    .instructions {

        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;

    .instructions p {

        line-height: 1.6;
        color: var(--darkBlue);
    }

    .checkContainer p {

        margin-right: 15px;
        flex-grow: 1;
        font-size: 16px;
        line-height: 1.4;
    }

    input[type="radio"] {

    legend {

        color: var(--white);

        border-radius: 6px;

        font-weight: bold;

        border-radius: 12px;

        padding: 15px;

        text-align: center;

        font-weight: bold;

<script>
const totalSlides = 30;

function formOne() {
    const form = document.forms['q1'];
    let countA = 0, countB = 0, countC = 0, countD = 0, countE = 0;

    for (let i = 1; i <= totalSlides; i++) {
        const question = form.elements[`question${i}`];
        if (!question || !question.value) {
            alert(`Please answer question ${i} before submitting.`);
            return false;
        }
        if (question.value === 'a') countA++;
        else if (question.value === 'b') countB++;
        else if (question.value === 'c') countC++;
        else if (question.value === 'd') countD++;
        else if (question.value === 'e') countE++;
    }

    const results = document.getElementById("results");
    results.style.display = "block";

    const styles = {
        'a': { label: 'Competing – ‘I win, you lose’', description: 'A highly competitive approach may give you a win in any one negotiation, but it can damage long-term relationships. You may drive a really hard bargain which the other party seems willing to live with it at the time, but it might not be long before they start build resentment and become reluctant to do business with you again.' },
        'b': { label: 'Collaborating – ‘We both win’', description: 'A collaborative approach favours strong relationships and the value of fair and equitable outcomes for all. Like all negotiating styles, it has its shortcomings. For example, a collaborative approach may prove to be impossible when you’re dealing with someone who has an entrenched win-lose approach to negotiation and refuses to be persuaded otherwise, despite your most skilful efforts.' },
        'c': { label: 'Compromising – ‘We both win and lose a little’', description: 'Compromising may help you safeguard existing relationships by simply splitting the difference between your position and that of the other party. It doesn’t necessarily give either of you the best deal possible. You should adopt a compromise approach if it’s clear that you don’t have enough common ground to adopt a collaborative approach or if a competitive approach seems risky.' },
        'd': { label: 'Avoiding – ‘Neither of us wins’', description: 'If you adopt an avoidance approach you may buy yourself some temporary peace of mind and freedom from possible conflict. Avoiding may also be a legitimate and powerful tactic in some circumstances. It may be a way of withdrawing from conflict with the other party and postponing certain issues to a time when you will be in a better position to negotiate.' },
        'e': { label: 'Accommodating – ‘I lose, you win’', description: 'This style may be used to intentionally focus on the needs and wants of the other party. In this scenario, the negotiator gives more than takes, often in the hopes that this generosity will be reciprocated in future negotiations. Alternatively, in some negotiation scenarios, it can also be taken as a sign of weakness that the other party will try to exploit.' }
    };

    const counts = { a: countA, b: countB, c: countC, d: countD, e: countE };
    const maxCount = Math.max(countA, countB, countC, countD, countE);
    const dominant = Object.keys(counts).filter(k => counts[k] === maxCount);

    let resultHTML = '';

    if (dominant.length > 1) {
        resultHTML = `<div class="score-display">Balanced across multiple styles</div><h2>No single dominant style</h2><p>Your responses are spread across multiple negotiation styles. You may adapt your approach depending on the situation.</p>`;
        dominant.forEach(d => {
            resultHTML += `<h3>${styles[d].label}</h3><p>${styles[d].description}</p>`;
        });
    } else {
        const d = dominant[0];
        resultHTML = `
            <div class="score-display">Your dominant style: ${styles[d].label}</div>
            <h2>${styles[d].label}</h2>
            <p>${styles[d].description}</p>
        `;
    }

    resultHTML += `
        <h3>Your full breakdown</h3>
        <p>
            Competing (A): <strong>${countA}</strong> &nbsp;|&nbsp;
            Collaborating (B): <strong>${countB}</strong> &nbsp;|&nbsp;
            Compromising (C): <strong>${countC}</strong> &nbsp;|&nbsp;
            Avoiding (D): <strong>${countD}</strong> &nbsp;|&nbsp;
            Accommodating (E): <strong>${countE}</strong>
        </p>
    `;

    results.innerHTML = resultHTML;
    results.scrollIntoView({ behavior: 'smooth' });
}
</script>
